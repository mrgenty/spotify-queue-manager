<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121212" />
  <title>__MAINTENANCE_TITLE__</title>
  <link rel="icon" id="page-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='54'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
  <style>
    :root { --brand: __MAINTENANCE_COLOR__; }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      
      background:
        radial-gradient(1200px 600px at 20% -10%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 60%),
        radial-gradient(800px 400px at 110% 0%, color-mix(in srgb, var(--brand) 20%, transparent), transparent 60%),
        linear-gradient(180deg, #0e0e0e 0%, #121212 35%, color-mix(in srgb, var(--brand) 17%, #121212) 100%);
      
      color: #fafafa;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
    }

    .message-card {
      background: #181818;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 14px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .logo {
      height: 60px;
      width: 60px;
      margin: 0 auto 25px auto;
      display: block;
    }

    .event-icon { display: block; width: 76px; height: 76px; object-fit: contain; margin: 0 auto 18px; }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #fafafa;
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      color: #b3b3b3;
      font-size: 16px;
      margin: 0;
    }
  </style>
</head>
<body>

  <main>
    <div class="message-card">
      
      __MAINTENANCE_ICON__
      <h1>Servizio momentaneamente non disponibile</h1>
      
      <p>
        Ci scusiamo per il disagio.<br>L'applicazione è in fase di manutenzione o l'evento potrebbe non essere ancora iniziato!<br>Riprova tra qualche minuto.
      </p>
    </div>
  </main>

</body>
</html>
